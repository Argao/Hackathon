services:
  # ===========================
  # Aplicação - Desenvolvimento
  # ===========================
  api-dev:
    build: .
    env_file:
      - .env
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_RUNNING_IN_CONTAINER=true
      - ENABLE_SWAGGER=true
      - ENABLE_DETAILED_LOGS=true
      - DATABASE_INITIALIZATION_TIMEOUT=30
      - ConnectionStrings__LocalDb=Data Source=/app/data/hack.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    profiles: [dev]

  # ===========================
  # Aplicação - Produção
  # ===========================
  api-prod:
    build: .
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_RUNNING_IN_CONTAINER=true
      - ENABLE_SWAGGER=false
      - ENABLE_DETAILED_LOGS=false
      - DATABASE_INITIALIZATION_TIMEOUT=30
      - ConnectionStrings__LocalDb=Data Source=/app/data/hack.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    profiles: [prod]