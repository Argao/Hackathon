name: SonarCloud (SAST)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install global tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-reportgenerator-globaltool
          echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH

      - run: dotnet restore

      - name: SonarCloud Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"Argao_Hackathon" \
            /o:"argao" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.login="$SONAR_TOKEN" \
            /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/wwwroot/**,**/*.sql,**/Program.cs"

      - run: dotnet build --configuration Release

      - name: Run tests with coverage
        run: |
          dotnet test Hackathon.sln \
            --configuration Release \
            --logger trx \
            --results-directory TestResults \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage"

      - name: Merge coverage reports
        run: |
          reportgenerator \
            "-reports:TestResults/**/coverage.opencover.xml" \
            "-targetdir:TestResults/coverage" \
            -reporttypes:"Cobertura;OpenCover"

      - name: SonarCloud End
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.login="$SONAR_TOKEN"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.opencover.xml
            TestResults/coverage/index.html

      - name: Dependency audit
        run: |
          set -e
          dotnet list package --vulnerable --include-transitive > vuln.txt || true
          if grep -Eqi 'Severity:.*Critical' vuln.txt; then
            echo 'Critical vulnerabilities detected in dependencies:'
            cat vuln.txt
            exit 1
          fi
          echo 'No Critical dependency vulnerabilities found.'
