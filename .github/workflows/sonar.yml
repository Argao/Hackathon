name: SonarCloud (SAST)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore
      - run: dotnet build --configuration Release

      - name: Run tests with coverage
        run: |
          dotnet test Hackathon.sln \
            --configuration Release \
            --logger trx \
            --results-directory TestResults \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage"

      - name: Merge coverage reports
        run: |
          export PATH="$PATH:/github/home/.dotnet/tools"
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            "-reports:TestResults/**/coverage.opencover.xml" \
            "-targetdir:TestResults/coverage" \
            -reporttypes:"Cobertura;OpenCover"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.opencover.xml
            TestResults/coverage/index.html

      - name: Dependency audit
        run: |
          set -e
          dotnet list package --vulnerable --include-transitive > vuln.txt || true
          if grep -Eqi 'Severity:.*Critical' vuln.txt; then
            echo 'Critical vulnerabilities detected in dependencies:'
            cat vuln.txt
            exit 1
          fi
          echo 'No Critical dependency vulnerabilities found.'

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Argao_Hackathon
            -Dsonar.organization=argao
            -Dsonar.cs.vstest.reportsPaths=TestResults/**/*.trx
            -Dsonar.cs.opencover.reportsPaths=TestResults/**/coverage.opencover.xml
            -Dsonar.coverage.exclusions=**/Migrations/**,**/wwwroot/**,**/*.sql,**/Program.cs
